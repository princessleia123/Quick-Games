<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hole.io — QuickPlay</title><link rel="stylesheet" href="hole-game.css"><link rel="stylesheet" href="hole-fix.css"></head><body><main class="hole-shell"><header class="hole-header"><a href="index.html">← QUICKPLAY</a><strong>HOLE<span>.IO</span></strong><button id="restartHole" type="button">Restart</button></header><section class="hole-game-wrap"><div class="hole-heading"><div><p>CLASSIC CITY · 60 SECOND ROUND</p><h1>Eat the city.</h1></div><span>WASD / ARROWS / MOUSE</span></div><div class="hole-stage"><canvas id="holeGame" width="960" height="600" aria-label="Hole.io style city game"></canvas><div class="hole-hud"><div><small>TIME</small><strong id="holeTimer">60</strong></div><div><small>SCORE</small><strong id="holeScore">0</strong></div><div><small>SIZE</small><strong id="holeSize">1.0</strong></div></div><div class="leaderboard" id="leaderboard"></div><div class="hole-toast" id="holeToast">Eat small objects to grow.</div><div class="hole-pad" aria-label="Hole movement"><button data-hole-key="up">▲</button><div><button data-hole-key="left">◀</button><button data-hole-key="down">▼</button><button data-hole-key="right">▶</button></div></div><div class="round-over" id="roundOver" hidden><p>ROUND OVER</p><h2 id="roundTitle">You placed #1</h2><span id="roundSummary"></span><button id="playAgain" type="button">Play again</button></div></div><p class="hole-help">Move under objects to swallow them. Bigger holes can eat bigger objects — and smaller rival holes.</p></section></main><script src="points.js"></script><script src="hole-game.js"></script></body></html>
